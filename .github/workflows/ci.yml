name: CI

on:
  push:
    branches: [live]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · format · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date, guaranteeing the committed
      # lockfile is the source of truth. Installs the pinned Python (3.12) too.
      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # The repo is public, so this is the gate that keeps secrets, machine addresses
      # and local paths out of bytes anyone can read.
      - name: Security scan
        run: uv run python -m ark.hygiene

      # Unit tests only: network is mocked, no archives hit, no legacy data needed.
      - name: Tests (pytest)
        run: uv run pytest

      # An ark-agent commit changes no rail file (AGENTS.md, Git); a session's PR does.
      - name: Rails
        if: github.event_name == 'pull_request'
        run: python3 scripts/agents/rails.py --ci ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
