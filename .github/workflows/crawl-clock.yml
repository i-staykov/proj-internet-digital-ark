name: crawl-clock

# The Wayback link crawl's waves, a year at a time: once every runner-crawl run of a PLAN year
# has ended, its next wave is dispatched to go on from the newest of them that left journals.
# A PLAN item is year:shards:minutes:first, first the run of the year's last wave dispatched
# by hand. A year's shards may change: its next wave splits the last one's journals anew.
# PAGES is the pages asked a site, EARN the link rows a site's pages write for one more.
# No model, no secret.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency: crawl-clock

env:
  PAGES: 30
  EARN: 1
  PLAN: >-
    1996:9:170:43759257480
    1997:3:170:43789004807
    1999:9:170:43737940518
    2000:9:170:43737957060
    2001:9:170:43737974902
  ROOTS: own-names:38

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runner-crawl.yml --limit 100 \
            --json databaseId,displayTitle,status)
          SUM=0
          for ITEM in $PLAN; do
            IFS=: read -r YEAR SHARDS MINUTES FIRST <<< "$ITEM"
            # first may carry no year in its title and be older than the list
            STATE=$(gh run view "$FIRST" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
            WAVES=$(jq -r --arg t "crawl $YEAR" --arg f "$FIRST $STATE" \
              '(.[] | select(.displayTitle == $t) | "\(.databaseId) \(.status)"), $f' <<< "$RUNS")
            if grep -qv ' completed$' <<< "$WAVES"; then continue; fi
            # newest first: a wave that left nothing is never the base of the next one
            PREV=
            while read -r ID _; do
              LEFT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID/artifacts" \
                --jq 'any(.artifacts[]; (.name | startswith("crawl_")) and (.expired | not))')
              if [ "$LEFT" = true ]; then PREV=$ID; break; fi
            done <<< "$WAVES"
            if [ -z "$PREV" ]; then echo "$YEAR has no journals to go on from"; continue; fi
            gh workflow run runner-crawl.yml --repo "$GITHUB_REPOSITORY" --ref live \
              -f year="$YEAR" -f years=1996-2001 -f shards="$SHARDS" -f minutes="$MINUTES" \
              -f run="$PREV" -f threads=8 -f interval=0.125 -f pages="${PAGES:-6}" -f earn="${EARN:-0}"
            echo "$YEAR $PREV"
            SUM=$((SUM + SHARDS))
          done
          echo "CRAWL_JOBS=$SUM" >> "$GITHUB_ENV"

      # The root lane on our own names (runner-roots.yml). ROOTS is release:slots: the jobs
      # that keep the repository's unfinished jobs under slots, the waves just dispatched
      # counted, take the release's next slices, numbered on from the highest a run's title
      # holds, so no slice is asked twice. Slice 0 is the test slice.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=: read -r TAG SLOTS <<< "$ROOTS"
          BUSY=$CRAWL_JOBS
          for STATUS in in_progress queued; do
            for ID in $(gh run list --repo "$GITHUB_REPOSITORY" --status "$STATUS" --limit 100 \
              --json databaseId --jq '.[].databaseId'); do
              BUSY=$((BUSY + $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ID/jobs?per_page=100" \
                --jq '[.jobs[] | select(.status != "completed")] | length')))
            done
          done
          NEXT=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runner-roots.yml --limit 100 \
            --json displayTitle --jq '[.[].displayTitle | select(test("^roots [0-9]+ [0-9]+$"))
            | split(" ") | (.[1] | tonumber) + (.[2] | tonumber)] | max // 1')
          HELD=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name
            | capture("^own_(?<n>[0-9]+)[.]txt[.]gz$").n | tonumber + 1] | max // 0')
          N=$((SLOTS - BUSY))
          N=$((HELD - NEXT < N ? HELD - NEXT : N))
          if [ "$N" -lt 1 ]; then echo "busy $BUSY, next slice $NEXT of $HELD"; exit 0; fi
          gh workflow run runner-roots.yml --repo "$GITHUB_REPOSITORY" --ref live \
            -f first="$NEXT" -f jobs="$((N > 40 ? 40 : N))" -f release="$TAG"
          echo "roots $NEXT $N"
