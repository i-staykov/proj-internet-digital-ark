name: Open the live-to-main snapshot PR
# D7: `live` is the working truth the fleet reads; `main` receives snapshots of it as
# merge commits that Ivo approves. This job only OPENS or refreshes the PR; a human merges.
# It runs on GitHub-hosted runners on purpose: the public repo must never touch the
# self-hosted runner, and this needs no secrets beyond the workflow's own token.
on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Open or refresh the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet origin/main origin/live; then
            echo "live and main identical, nothing to open"; exit 0
          fi
          EXISTING=$(gh pr list --base main --head live --state open --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open"; exit 0
          fi
          gh pr create --base main --head live \
            --title "Snapshot: live to main, $(date -u +%F)" \
            --body "Snapshot of the working branch. Contents: the banked register and code changes since the last snapshot. Merge it as a merge commit, not a squash: live keeps its history and carries on as the working branch."
