name: runner-lane-long

# The long lane: a self-hosted runner on the owner's cloud VM (scripts/fleet/join.sh, labelled
# ark-lane) walks one bank-cut docs/registers/runner/long_*.txt slice for up to 23 hours from its
# own address, the rest as runner-lanes.yml. Its own workflow, since runner-lanes' concurrency
# group would hold the hourly slice all day and its pending job would read as a live run to the
# tick's dispatch. GitHub cancels a run queued over 24 hours, so WALK_SECONDS stays under 23 h.
# The gate on fork code reaching the VM is the repository's "require approval for all external
# contributors" setting; the VM holds no secret and nothing that knows the bank. The soft knob is
# docs/registers/runner/long.
on:
  schedule:
    - cron: "47 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency: runner-lane-long

env:
  WORKERS: 2
  WALK_SECONDS: 82800
  # the collectors' disk floor (src/ark/disk.py): the VM has 45 GiB
  ARK_FREE_SPACE_GIB: 1
  ARK_WRITE_BUDGET_GIB: 1

jobs:
  long:
    runs-on: [self-hosted, linux, ark-lane]
    timeout-minutes: 1400
    env:
      INDEX: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: live
          persist-credentials: false

      # The index-th long slice no artifact is named after: one API request, read only; curl and
      # jq, since the VM has no gh, under pipefail so a failed listing is "no listing", not an
      # empty one that re-walks a taken slice.
      - id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -e docs/registers/runner/STOP ]; then echo "STOP holds"; exit 0; fi
          taken=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            | jq -r '.artifacts[] | select(.expired | not) | .name') || { echo "no listing"; exit 0; }
          i=0
          for f in docs/registers/runner/long_*.txt; do
            [ -e "$f" ] || break
            s=$(basename "$f" .txt)
            if printf '%s\n' "$taken" | grep -q "^${s}_r"; then continue; fi
            if [ "$i" = "$INDEX" ]; then echo "slice=$s" >> "$GITHUB_OUTPUT"; echo "$s"; exit 0; fi
            i=$((i + 1))
          done
          echo "no slice for index $INDEX"

      # A self-hosted workspace persists: the last job's data goes first. The walker's own
      # back-off; TERM at the day's end saves what it owes, KILL two minutes on. Its exit is in
      # its log, never a red run.
      - if: steps.pick.outputs.slice != ''
        env:
          SLICE: ${{ steps.pick.outputs.slice }}
        run: |
          rm -rf runner-data
          timeout -k 120 "$WALK_SECONDS" python3 scripts/engines/cdx_extended_walk.py --lane 0 --lanes 1 \
            --workers "$WORKERS" --slice "docs/registers/runner/$SLICE.txt" --data runner-data \
            || echo "walker exit $?"

      # Named by the slice, _r1: taken, banked as runner1. Dot files (a torn journal) are excluded.
      - if: always() && steps.pick.outputs.slice != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pick.outputs.slice }}_r1
          path: runner-data/raw
          retention-days: 3
          if-no-files-found: ignore
